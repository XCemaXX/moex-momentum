name: pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.9"
          enable-cache: true
      - name: Sync deps
        # `--locked` fails when uv.lock does not match pyproject.toml. `--frozen`
        # only installs the lock as-is, so a forgotten relock would pass silently.
        # Dev group stays: the Tests step below gates the deploy.
        run: uv sync --locked
      - name: Tests
        # The lint workflow runs on the same push but nothing here waits for it,
        # so without this the site would publish numbers whose regression against
        # tests/reference/ has already gone red. Runs before the 2.5 min of
        # recompute so a red suite fails fast.
        run: uv run pytest -q
      - name: Recompute monthly returns
        # data/momentum/monthly/ is gitignored — regenerate from committed raw CSV.
        run: uv run momentum compute monthly --from-scratch
      - name: Recompute backtest (q_values + holdings)
        # data/momentum/{signal}/ is gitignored — recompute. Both signals: the
        # default pages use curve_fit, compare.html needs simple too.
        run: |
          uv run momentum compute backtest --signal curve_fit
          uv run momentum compute backtest --signal simple
      - name: Compute weight sweep
        # data/momentum/sweep/q1_nav.csv — fan of 11 a/b weights for compare.html.
        run: uv run momentum compute sweep
      - name: Compute top-K concentration fan
        # data/momentum/topn_fan/fan_concentration.csv — top-K fan for compare.html.
        run: uv run momentum compute fan
      - name: Build site
        run: uv run momentum site build --out _site
      - name: Smoke-check the built site
        # A compute step can succeed while writing less than expected; every page
        # still renders and only a section goes missing, so check the artefacts
        # and that the newest month actually reached the site.
        run: |
          test -s _site/index.html
          test -s _site/data.json
          test -s _site/plotly.min.js
          latest=$(ls data/momentum/curve_fit/holdings/*.json | tail -1 | xargs basename -s .json)
          grep -q "\"$latest\"" _site/data.json || {
            echo "::error::$latest missing from _site/data.json"; exit 1; }
          echo "site carries $latest"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
