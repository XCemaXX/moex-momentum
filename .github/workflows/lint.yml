name: lint

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.9"
          enable-cache: true
      - name: Sync deps
        # `--locked` fails when uv.lock does not match pyproject.toml. `--frozen`
        # only installs the lock as-is, so a forgotten relock would pass silently.
        run: uv sync --locked
      - name: ruff format check
        if: ${{ !cancelled() }}
        run: uv run ruff format --check
      - name: ruff lint
        if: ${{ !cancelled() }}
        run: uv run ruff check
      - name: mypy
        if: ${{ !cancelled() }}
        run: uv run mypy src
      - name: pytest
        if: ${{ !cancelled() }}
        run: uv run pytest
