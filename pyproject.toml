[project]
name = "moex-momentum"
version = "0.1.0"
description = "Momentum pipeline for Russian equities (MOEX)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28",
    # pandas 3 changed Copy-on-Write and the string dtype defaults; a range that
    # spans the 2→3 boundary would resolve to a different engine on a fresh clone.
    "pandas>=3.0",
    "numpy>=2.4",
    "plotly>=7.0",
    "jinja2>=3.1",
    "markdown-it-py>=4.0",
    "typer>=0.27",
    "lxml>=6.1.3",
]

[project.scripts]
momentum = "cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
    "mypy>=2.3",
    "pandas-stubs>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat layout: everything under src/ ships at top level (sources strips the
# prefix). One uniform rule for packages AND bare modules (config.py, tickers.py)
# — no force-include, which copies bare modules into site-packages and shadows
# the editable src path, hiding edits until a reinstall.
only-include = ["src"]
sources = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# ruff 0.16 formats fenced code inside Markdown. Task write-ups in `tasks/` are a
# closed record and `agent_context/` holds pasted throwaway snippets — reformatting
# either rewrites history to no benefit.
extend-exclude = ["*.md", ".claude"]

[tool.ruff.lint]
# W/NPY/TID/ISC/RET were measured at zero violations — free to keep clean.
# C4/SIM/PERF/PTH/FURB/A would cost ~24 mechanical edits for style only; DTZ
# fires on the injectable `date.today()` reads in ingest, which are deliberate.
select = ["E", "F", "I", "N", "UP", "B", "PL", "W", "NPY", "TID", "ISC", "RET"]
ignore = [
    "PLR0913",  # too many arguments — backtest functions need them
    "PLR0917",  # same, counted positionally (ruff 0.16)
    "PLR2004",  # magic numbers — fine in tests/configs
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "N802", "E501"]
"src/cli/**" = ["B008", "PLC0415"]  # typer requires Option in defaults; lazy imports avoid heavy deps

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["plotly.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
# A parametrisation that globs the data tree must fail loudly when the tree
# moves, not collapse into a single silent skip.
empty_parameter_set_mark = "fail_at_collect"
# The project sits on a pandas major that deprecates actively; a FutureWarning is
# the only early signal that numbers will move in the next release.
filterwarnings = ["error"]
